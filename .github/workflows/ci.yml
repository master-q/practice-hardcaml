name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# The toolchain is pinned in toolchain/ and installed by scripts/toolchain.sh
# under ~/.practice-hardcaml (issues #11, #12). Each part is cached under a
# key derived from its pin, so a pin change downloads or rebuilds only that
# part; the caches are saved right after installation, even if tests fail.
env:
  PRACTICE_HARDCAML_HOME: /home/runner/.practice-hardcaml
  DUNE_CACHE: enabled

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Language policy (ASCII only)
        run: scripts/check_ascii.sh

      - name: Commit messages are ASCII
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git log --format=%B "origin/${{ github.base_ref }}..HEAD" \
               | LC_ALL=C grep -nP '[^\x00-\x7F]'; then
            echo "ERROR: non-ASCII characters in commit messages"; exit 1
          fi

      - name: System packages (no EDA tools; those are pinned)
        run: |
          sudo apt-get update
          sudo apt-get install -y opam libgmp-dev libffi-dev pkg-config

      - name: Cache keys
        id: keys
        run: scripts/toolchain.sh key >> "$GITHUB_OUTPUT"

      - name: Restore OSS CAD Suite
        id: cad
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PRACTICE_HARDCAML_HOME }}/toolchain/oss-cad-suite-*
          key: ${{ runner.os }}-${{ steps.keys.outputs.cad }}

      - name: Restore RISC-V GCC
        id: gcc
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PRACTICE_HARDCAML_HOME }}/toolchain/riscv-gcc-*
          key: ${{ runner.os }}-${{ steps.keys.outputs.gcc }}

      - name: Restore opam switch
        id: opam
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PRACTICE_HARDCAML_HOME }}/opam
          key: ${{ runner.os }}-${{ steps.keys.outputs.opam }}

      - name: Install the pinned toolchain (no-op when restored)
        run: scripts/toolchain.sh install

      - name: Save OSS CAD Suite
        if: steps.cad.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PRACTICE_HARDCAML_HOME }}/toolchain/oss-cad-suite-*
          key: ${{ runner.os }}-${{ steps.keys.outputs.cad }}

      - name: Save RISC-V GCC
        if: steps.gcc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PRACTICE_HARDCAML_HOME }}/toolchain/riscv-gcc-*
          key: ${{ runner.os }}-${{ steps.keys.outputs.gcc }}

      - name: Save opam switch
        if: steps.opam.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PRACTICE_HARDCAML_HOME }}/opam
          key: ${{ runner.os }}-${{ steps.keys.outputs.opam }}

      - name: Dune cache and riscv-arch-test sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/dune
            bench/arch_test/build/src
          key: ${{ runner.os }}-build-${{ steps.keys.outputs.opam }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-build-${{ steps.keys.outputs.opam }}-

      - name: Toolchain matches the pins
        run: |
          eval "$(scripts/toolchain.sh env)"
          scripts/toolchain.sh check
          scripts/versions.sh

      - name: Test ladder (S0-S3)
        run: |
          eval "$(scripts/toolchain.sh env)"
          make ci
